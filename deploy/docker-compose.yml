# Single-box (plan 02 §9): Caddy serves the built client (web-game/dist/game/browser) and proxies
# /ws and /health to the game server; worlds and accounts live in the `data` volume.
# PostgreSQL joins when the repository adapter for it exists (R-15).
# Usage: (cd web-game && npm run build) && docker compose -f deploy/docker-compose.yml up -d --build
# NOT RUN YET on the development machine (Docker Desktop off, 2026-11-09).
services:
  game-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    environment:
      ADDR: 0.0.0.0:8080
      DATA_DIR: /data
      DEV_MODE: ${DEV_MODE:-false}
      WORLD_STEP_SECONDS: ${WORLD_STEP_SECONDS:-1}
    volumes:
      - data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web-game/dist/game/browser:/srv:ro
      - caddy-data:/data
    depends_on:
      - game-server
    restart: unless-stopped

volumes:
  data:
  caddy-data:
