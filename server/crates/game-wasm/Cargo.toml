[package]
name = "game-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "WebAssembly build of the game session for the client worker (GameApi on WASM, plan 02 B3): a plain C ABI with JSON messages, no JS glue generator."

