[package]
name = "game-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Network game server (plan 02 B4): accounts, one authoritative world per player run by game-session, WebSocket protocol, world scheduler, persistence of snapshots and the command log."

[[bin]]
name = "game-server"
path = "src/main.rs"

[dependencies]
game-core = { path = "../game-core" }
game-session = { path = "../game-session" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "json", "query"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.2"

[dev-dependencies]
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }

[lints.rust]
unsafe_code = "forbid"
