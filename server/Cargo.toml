[workspace]
resolver = "3"
members = ["crates/game-core", "crates/game-wasm", "conformance"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
# fdlibm-derived sin/cos (musl port): bit-identical with V8's Math.sin/cos for the Atanor trajectory sampling
libm = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Small, fast-starting WebAssembly for the client worker (plan 02 §3.1: game-wasm).
[profile.wasm]
inherits = "release"
opt-level = "z"
debug = false
strip = true
