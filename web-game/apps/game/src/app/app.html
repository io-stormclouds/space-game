<div class="hud-root hud-gridfield shell">
  <header
    hudResourcePanel
    class="shell__top"
    [readouts]="readouts"
    [designation]="t.sample.designation"
    [subline]="t.sample.subline"
    serial="WG · F0"
  ></header>

  <main class="shell__stage">
    <section hudFrame class="shell__view" [label]="t.shell.viewLabel" [serial]="t.shell.viewSerial">
      <h1 class="hud-title">{{ t.shell.viewTitle }}</h1>
      <p class="shell__note">{{ t.shell.viewNote }}</p>
      <p class="shell__log" aria-live="polite">
        @if (lastCommand(); as command) {
          <span class="hud-micro">{{ t.shell.lastCommand }}</span>
          <span class="shell__log-value">{{ command }}</span>
        } @else {
          <span class="hud-micro">{{ t.shell.noCommand }}</span>
        }
      </p>
    </section>

    <div class="shell__dock">
      <hud-command-card
        title="CMD"
        [context]="t.sample.selection"
        [status]="t.sample.selectionCode"
        serial="CC-06"
        [columns]="4"
        [rows]="2"
        [slots]="commands"
      />
    </div>
  </main>
</div>
